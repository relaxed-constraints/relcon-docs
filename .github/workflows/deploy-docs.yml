name: Deploy documentation
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to build the caller's documentation
        type: string
        default: "3.11"
      uv-version:
        description: uv version used to install the caller's locked docs dependencies
        type: string
        default: "0.13.6"

permissions:
  contents: read

# Serialize Pages deployments in the caller repository, including releases.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: uv sync --locked --group docs
      - run: uv run --group docs relcon-docs configure --check
      - run: uv run --group docs zensical build --strict
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
