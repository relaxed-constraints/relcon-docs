name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run relcon-docs configure --check
      - run: uv run zensical build --strict
      - run: uv build
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          uv venv /tmp/relcon-docs-wheel
          uv pip install --python /tmp/relcon-docs-wheel/bin/python dist/*.whl
          mkdir -p /tmp/relcon-docs-example/docs
          cd /tmp/relcon-docs-example
          /tmp/relcon-docs-wheel/bin/relcon-docs configure
          test -f .github/workflows/docs.yml
          /tmp/relcon-docs-wheel/bin/relcon-docs configure --check
          echo '# Wheel smoke test' > docs/index.md
          /tmp/relcon-docs-wheel/bin/zensical build --strict
